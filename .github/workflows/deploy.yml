name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# The default GITHUB_TOKEN is all this deploy needs: `pages: write` to publish
# and `id-token: write` for the OIDC token deploy-pages exchanges with Pages.
# No PAT, no deploy key, no repository secrets of any kind.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time. In-flight runs are allowed to finish rather than being
# cancelled, so a half-published artifact can never become the live site.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate dataset
        run: npm run generate-data

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
